<html>
    <head>
        <title>Registration</title>
    </head>
    <form>
        <div style="height: 800px; width: 400px;box-shadow: 0px 0px 10px gray;background-color:lightgrey;margin: 50px auto;border-radius: 30px;">
            <div ><h1 style="font-size: large;text-align: center;height:20px;padding-top: 20px;">Student registration form</h1></div>
            <div style="margin-bottom: 15px;">
                <label for="nm" style="font-weight: bold;margin-left: 10px;">Name:</label><br>
                <input type="text" name="name" id="nm" placeholder="enter your name" style="padding: 10px;width: 95%;margin-top: 5px;border-radius: 5px;border: 1px solid gray;margin-left: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="em" style="font-weight: bold;margin-left: 10px;">Email:</label><br>
                <input type="email" name="email" placeholder="Enter your email" id="em" style=" padding: 10px;width: 95%;margin-top: 5px;border-radius: 5px;border: 1px solid gray;margin-left: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="pas"  style="font-weight: bold;margin-left: 10px;margin-left: 10px;">Password:</label><br>
                <input type="password" id="pas" placeholder="Enter your password" name="password" style=" padding: 10px;width: 95%;margin-top: 5px;border-radius: 5px;border: 1px solid gray;margin-left: 10px;">
            </div>
            <div  style="margin-bottom: 15px;">
                <label for="mb"  style="font-weight: bold;margin-left: 10px;margin-left: 10px;">Mobile no:</label><br>
                <input type="tel" id="mb" name="Mobileno" placeholder="Enter your mobile no" style=" padding: 10px;width: 95%;margin-top: 5px;border-radius: 5px;border: 1px solid gray;margin-left: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="dob" style="font-weight: bold;margin-left: 10px;margin-left: 10px;">Date of Birth:</label><br>
                <input type="date" id="dob" name="date" type="tel" id="mb" name="Mobileno" placeholder="Enter your mobile no" style=" padding: 10px;width: 95%;margin-top: 5px;border-radius: 5px;border: 1px solid gray;margin-left: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="" style="font-weight: bold;margin-left: 10px;">Gender:</label>
                <input type="radio" value="male" name="gender" id="ml" style=" padding: 10px;margin-left: 10px;">
                <label for="ml">male</label>

                <input type="radio" value="female" name="gender" id="fl" style=" padding: 10px;margin-left: 10px;">
                <label for="fl">female</label><br>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="co" style="font-weight: bold;margin-left: 10px;">Course:</label>
                <select name="course" id="" style=" padding: 10px;width: 95%;margin-top: 5px;border-radius: 5px;border: 1px solid gray;margin-left: 10px;">
                    <option value="python">python</option>
                    <option value="sql">SQL</option>
                    <option value="java">java</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="ad" style="font-weight: bold;margin-left: 10px;">Address:</label>
                <input type="text" name="address" id="ad" placeholder="Enter your address" style=" padding: 10px;width: 95%;margin-top: 5px;border-radius: 5px;border: 1px solid gray;margin-left: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="" style="font-weight: bold;margin-left: 10px;">Terms & condition</label>
                <input type="checkbox" name="Terms & condition" id="tc"  value="tick">
                <label for="tc"  ><p style="margin-bottom: 15px;margin-left: 20px;width: 95%;font-size: smaller;" >By enrolling in the course, students agree to provide accurate information and follow all institute rules and guidelines. </p></label>
            </div>
            <div style="margin-bottom: 15px;">
                <button type="submit" style="margin-left:130px;padding-top:5px auto;">Submit</button>
                <button type="reset" style="margin-left:10px;padding-top:5px auto;">reset</button>
            </div>
        

        </div>
    </form>
</html>
